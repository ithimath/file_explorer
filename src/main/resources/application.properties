# Application Server Port
server.port=8080

# Application Name
spring.application.name=file-explorer

# Workspace Directory (Relative to project root or absolute path)
file.explorer.root-dir=./workspace

# Spring MVC Static Resource Handling
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Logging configuration
logging.level.com.example.fileexplorer=INFO
logging.level.org.springframework.web=INFO
